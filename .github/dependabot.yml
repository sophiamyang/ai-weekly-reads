version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for routine patch/minor bumps; majors still arrive separately so
      # they get looked at on their own.
      minor-and-patch:
        update-types:
          - minor
          - patch
